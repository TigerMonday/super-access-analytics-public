[project]
name = "report-export"
version = "0.1.0"
description = "Markdownレポートを HTML/PDF/Word(docx)/Excel(xlsx) へ変換する汎用CLI"
requires-python = ">=3.11,<3.15"
dependencies = [
    "markdown>=3.6",
    "nh3>=0.3",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "playwright>=1.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# gdoc/gsheet出力を使う場合のみ必要(未インストールでも他の形式は使える。遅延importで対応)。
google = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_export"]
include = ["src/report_export/assets/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

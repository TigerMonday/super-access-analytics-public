[project]
name = "report-export-bridge"
version = "0.1.0"
description = "01の preferences.output_formats を読み、成果物MDを common/report_export で変換する橋渡し（標準ライブラリのみ）"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["report_export_bridge.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

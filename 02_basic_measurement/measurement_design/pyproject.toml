[project]
name = "basic-design2"
version = "1.0.0"
description = "計測設計 CLI — GA4/GTM データ取得 + Claude APIによる計測設計書自動生成"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-analytics-data>=0.18.0",
    "google-analytics-admin>=0.23.0",
    "google-auth>=2.20.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.100.0",
    "anthropic>=0.26.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]

# KPI・ゴール定義・主要イベントテンプレート → context/<client_id>/kpis.yaml にコピーして記入
# kpi_id 形式は measurement_design と互換
kgi: ""                    # 事業のゴール（自由記述・任意）
kpis:
  - kpi_id: kpi_001
    name: ""               # KPI名（必須）
    target_metric: ""      # 指標種別（例: イベント数）
    target_value:
      goal: 0
      unit: ""             # 例: 件/月
    description: ""
    related_pages:
      - page_id: ""        # 関連ページの識別子
    events:                # このKPIを計測しているGA4イベント名（複数可・必須確認項目）
      - ""
    form_pages:            # リードサイトのみ。フォーム通過率の分母にするページ
      - path: ""
        match_type: exact  # exact / contains
    priority: null         # 複数KPIがあるときだけ聞く。どれが主か（1が最優先）。1件のみなら聞かず未設定でよい
key_events:                # CV計算に使うGA4イベント名（全KPI横断の一覧）
  - ""

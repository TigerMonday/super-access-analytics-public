[project]
name = "context-management"
version = "0.1.0"
description = "コンテキスト管理エージェント - 全エージェント共通のクライアント前提情報ストアと共通ローダー"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# installable化（`uv pip install -e 01_context_management/` で `import context_store` が
# どこからでも通るようにする）。`PYTHONPATH=src` 方式との後方互換のため、パッケージ本体は
# 従来どおり src/context_store に置いたまま、hatchling にそこだけをビルド対象として教える。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_store"]

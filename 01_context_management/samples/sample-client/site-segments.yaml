# サイトセグメント（分析対象の定義）記入例。
# 利用者が最初に埋める入力欄ではない。01/03がGA4のページ一覧・パスの構造から
# 「役割の違うセクションがありそう」と気づいて提案し、確認が取れた結果だけを保存する
# （このファイルは profile.yaml の notes にある「製品サイトとブログのサブドメインも計測対象」
# を受けて、ブログ（オウンドメディア）を分けて集計することにした想定の記入例）。
#
# 一致条件（match）を書くのは、本体サイトと役割が違うセクション（ここではオウンドメディア）
# だけでよい。それ以外のページ（トップ・about・お問い合わせ・LP等）は訪問者も目的も本体サイトと
# 同じなので、本体サイトのセグメントに default: true を付けておけば、match に一致しなかった
# ページは自動でそこに分類される。「その他」という3つ目のバケツは作らない。
site_segments:
  - segment_id: seg_001
    name: オウンドメディア
    description: 集客記事。本体サイトとは訪問目的が異なる
    match:
      host_name: blog.example.com
  - segment_id: seg_002
    name: 本体サイト
    description: サービス紹介・会社紹介・問い合わせ。上のどれにも当てはまらないページ
    default: true                 # match に一致しないページ（トップ・about・お問い合わせ等）は全部ここ

# --- 同じドメインの中でディレクトリごとに役割が違う場合（こちらのほうが多い） ---
# 上の host_name の代わりに path_prefix を使う。リストで複数指定できる。
#
#  - segment_id: seg_003
#    name: オウンドメディア
#    description: 集客記事
#    match:
#      path_prefix: "/media/"
#
#  - segment_id: seg_004
#    name: 本体サイト
#    description: サービス紹介・料金・問い合わせ。上のどれにも当てはまらないページ
#    default: true
#
# --- 3つ目以降のセグメントが要るサイトの例（採用サイトを別枠で見たい場合） ---
# 2値に固定する必要はない。切り出したいセクションが複数あれば match をそれぞれに書き、
# default: true は「残り全部」を受け取る本体サイトの1件だけに付ける。
#
#  - segment_id: seg_005
#    name: 採用サイト
#    description: 求人・社員紹介
#    match:
#      path_prefix: "/recruit/"

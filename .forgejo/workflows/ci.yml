name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: 計測設計テスト
        working-directory: 02_basic_measurement/measurement_design
        run: uv run --locked --group dev python -m pytest
      - name: 基本分析テスト
        working-directory: 04_traffic_analysis/parameter_management
        run: uv run --locked --group dev python -m pytest
      - name: コンテキスト管理テスト
        working-directory: 01_context_management
        run: uv run --locked --group dev python -m pytest
      - name: レポート変換テスト
        working-directory: common/report_export
        run: |
          uv run --locked playwright install --with-deps chromium
          uv run --locked --extra dev python -m pytest -q
      - name: 変換ブリッジテスト
        working-directory: common/report_export_bridge
        run: uv run --locked --extra dev python -m pytest
      - name: 共通ツール・レポート一覧テスト
        run: |
          uv run --locked --project 04_traffic_analysis/parameter_management python -m pytest tools/tests tools/test_report_quality_check.py tools/test_site_improvement_report.py tools/test_validate_market_report.py tools/test_validate_measurement_report.py tools/test_validate_report_connections.py common/ga4_fetch/tests common/report_index/tests 03_external_research/web_research/competitor-ahrefs-analysis/tests --ignore=tools/tests/test_setup_status.py
          uv run --locked --project 01_context_management python -m pytest tools/tests/test_setup_status.py
      - name: 公開前検査
        run: |
          uv run --locked --project 04_traffic_analysis/parameter_management python tools/check_links.py
          uv run --locked --project 04_traffic_analysis/parameter_management python tools/leak_check.py --pattern-only
      - name: URL撮影のセキュリティテスト
        working-directory: 05_campaign_optimization/2_target_page_plan/creation
        run: |
          npm ci --ignore-scripts
          node --test tests/*.test.mjs
